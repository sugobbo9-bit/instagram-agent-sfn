name: Publish

on:
  schedule:
    # 12:00 UTC = 09:00 America/Sao_Paulo
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validar sem publicar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests

      - name: Publicar proximo item da fila
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/publisher.py

      - name: Commit do estado
        if: always()
        run: |
          git config user.name  "instagram-agent[bot]"
          git config user.email "instagram-agent[bot]@users.noreply.github.com"
          git add data/ published/ logs/ || true
          git diff --staged --quiet || git commit -m "publish: atualiza fila e banco de dados"
          git push || true
