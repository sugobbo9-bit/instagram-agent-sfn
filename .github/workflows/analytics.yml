name: Analytics

on:
  schedule:
    # 3x ao dia: cobre os checkpoints de 24h / 72h / 7d / 30d
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests

      - name: Coletar metricas nos checkpoints devidos
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/analytics_collector.py

      - name: Commit das metricas
        run: |
          git config user.name  "instagram-agent[bot]"
          git config user.email "instagram-agent[bot]@users.noreply.github.com"
          git add data/ analytics/ logs/ || true
          git diff --staged --quiet || git commit -m "analytics: coleta de checkpoints"
          git push || true
